[project]
name = "dark-water"
version = "0.1.0"
description = "Dark Depletion Watchlist: cross GRACE/GRACE-FO storage decline against groundwater monitoring darkness to find unwatched aquifer depletion."
readme = "README.md"
authors = [
    { name = "rlrognstad", email = "rlrognstad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.7",
    "geopandas>=1.0",
    "shapely>=2.0",
    "netcdf4>=1.7",
    "earthaccess>=0.18.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "dask>=2026.7.1",
    "cartopy>=0.25.0",
    "matplotlib>=3.11.1",
    "hydrostations",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
hydrostations = { path = "../hydrostations/packages/hydrostations", editable = true }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
